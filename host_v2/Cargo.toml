[workspace]
members = [
    "crates/sensor-core",
    "crates/sensor-protocol",
    "crates/sensor-host",
]
resolver = "2"

[workspace.package]
version = "0.5.0-dev"
edition = "2021"
rust-version = "1.81"
license = "MIT"

[workspace.dependencies]
serialport = { version = "4.10.1", default-features = false }
serde_json = "1.0"
nix = { version = "0.26.4", default-features = false, features = ["fs", "signal"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
